name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6.0.0
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          DIFF=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})

          # App changes: exclude .md files and .github/ directory
          APP_CHANGES=$(echo "$DIFF" | grep -vE '(\.md$|^\.github/)' || true)

          # Always include android.yml changes
          WORKFLOW_CHANGES=$(echo "$DIFF" | grep -E '^\.github/workflows/android\.yml$' || true)

          CHANGES="${APP_CHANGES}${WORKFLOW_CHANGES}"
          
          if [ -z "$CHANGES" ]; then
            echo "No relevant changes found. Skipping tests."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "Relevant changes detected."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
  lint:
    name: Run Android Lint
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    uses: infomaniak/.github/.github/workflows/android-lint.yml@v2

  instrumentation-tests:
    needs: check-changes
      # This job ONLY runs if the previous job found relevant files
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: [ self-hosted, Android ]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6.0.0
        with:
          token: ${{ github.token }}
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      # Making sure the app compiles
      - name: Build app
        run: ./gradlew assembleDebug

      - name: Run unit tests and analyze with sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew testStandardDebugUnitTest testFdroidDebugUnitTest sonar --info --stacktrace

      - name: Stop Gradle daemons
        if: always()
        run: ./gradlew --stop || true
