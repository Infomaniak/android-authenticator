name: Euria Review

on:
  pull_request:
    types: [labeled]

jobs:
  euria-review:
    if: ${{ github.event.label.name == 'euria-review' }}
    uses: infomaniak/.github/.github/workflows/euria-review.yml@v2
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    secrets: inherit
